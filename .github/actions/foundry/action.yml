name: Set up Foundry tools
description: Retain Anvil and Cast while using pinned forgeds for compilation
runs:
  using: composite
  steps:
    - name: Install Anvil and Cast
      uses: foundry-rs/foundry-toolchain@v1
    - name: Install pinned forgeds
      uses: doublesharp/foundry@a6e5db53bb23230eceb0600d6c1bdfafc1bfb47e # setup-forgeds-v1.0.2
      with:
        forgeds-version: 9287d4b46d2bbecb17deb41cd5cb385fc31a503c
        forge-alias: 'true'
        cache-compilers: 'true'
        cache-prefix: abi-typegen
