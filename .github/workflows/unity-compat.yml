name: Unity compatibility

# Unity requires an activated Editor and Linux IL2CPP module. Keep this explicit
# until a qualified runner is available; ordinary binding CI remains independent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity:
    name: Editor, Anvil, and standalone players
    if: vars.UNITY_ENGINE_CI_ENABLED == 'true' && vars.UNITY_EDITOR_6000_6_3F1 != ''
    runs-on: [self-hosted, linux, unity-6000.6.3f1, unity-linux-il2cpp]
    timeout-minutes: 60
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_6000_6_3F1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
      - uses: ./.github/actions/foundry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify result validation
        run: python3 e2e/native/unity/test_runner.py
      - name: Regenerate bindings and qualify Unity
        run: make e2e-unity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-results
          path: |
            e2e/native/unity/TestResults
            e2e/native/unity/Build/**/build.log
            e2e/native/unity/Build/**/player.log
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          budget: 4GiB
