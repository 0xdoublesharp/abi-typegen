name: Unreal compatibility

# Unreal Engine is installed and licensed separately. Keep the workflow manual
# and require an explicitly configured 5.8.3 self-hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal:
    name: Unreal Engine 5.8.3
    if: vars.UNREAL_ENGINE_CI_ENABLED == 'true' && vars.UNREAL_ROOT_5_8_3 != ''
    runs-on: [self-hosted, macOS, ARM64, unreal-engine-5.8.3]
    timeout-minutes: 90
    env:
      UNREAL_ROOT: ${{ vars.UNREAL_ROOT_5_8_3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Configure Cargo Steward wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: start
      - uses: ./.github/actions/foundry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unreal qualification
        run: make e2e-unreal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unreal-results
          path: |
            e2e/native/unreal/TestResults
            e2e/native/unreal/Build
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.2
        with:
          mode: trim
          budget: 4GiB
